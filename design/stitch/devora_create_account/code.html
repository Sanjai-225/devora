<script>
    // Password visibility toggle micro-interaction
    const pwdInput = document.getElementById('password');
    const toggleBtn = document.getElementById('toggle-pwd-btn');
    const eyeIcon = document.getElementById('eye-icon');

    if (toggleBtn && pwdInput && eyeIcon) {
      toggleBtn.addEventListener('click', () => {
        const isPwd = pwdInput.type === 'password';
        pwdInput.type = isPwd ? 'text' : 'password';
        eyeIcon.textContent = isPwd ? 'visibility_off' : 'visibility';
      });
    }

    // Role selector pills toggle
    const pills = document.querySelectorAll('.role-pill');
    pills.forEach(pill => {
      pill.addEventListener('click', () => {
        pills.forEach(p => {
          p.classList.remove('bg-surface-container-high', 'text-primary');
          p.classList.add('bg-surface-container', 'text-on-surface-variant');
          const icon = p.querySelector('.material-symbols-outlined');
          if (icon) {
            icon.classList.remove('text-primary-container');
            icon.classList.add('text-outline');
          }
        });
        pill.classList.remove('bg-surface-container', 'text-on-surface-variant');
        pill.classList.add('bg-surface-container-high', 'text-primary');
        const icon = pill.querySelector('.material-symbols-outlined');
        if (icon) {
          icon.classList.remove('text-outline');
          icon.classList.add('text-primary-container');
        }
      });
    });
  </script>
